# Baut die App bei jedem Push auf main und veröffentlicht sie auf GitHub Pages.
# Einmalig im Repo einstellen: Settings → Pages → Source: „GitHub Actions“.
name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: Europe/Berlin
      - run: npm run build
        env:
          # Pages liefert unter https://<name>.github.io/<repo>/ aus.
          # Heißt das Repo selbst <name>.github.io, hier "/" eintragen.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
